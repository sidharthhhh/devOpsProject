syntax = "proto3";

package chat;

option go_package = "grpc-chat/proto/chat";

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Services
// ─────────────────────────────────────────────────────────────────────────────

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetProfile(GetProfileRequest) returns (UserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
}

service RoomService {
  rpc CreateRoom(CreateRoomRequest) returns (Room);
  rpc GetRoom(GetRoomRequest) returns (Room);
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  rpc ListRoomMembers(ListRoomMembersRequest) returns (ListRoomMembersResponse);
  rpc CreateDirectMessage(CreateDirectMessageRequest) returns (Room);
  rpc GetRoomHistory(GetRoomHistoryRequest) returns (GetRoomHistoryResponse);
}

service ChatService {
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}

service FileService {
  rpc UploadFile(stream FileChunk) returns (UploadFileResponse);
  rpc GetFileURL(GetFileURLRequest) returns (GetFileURLResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
}

service NotificationService {
  rpc SubscribeNotifications(SubscribeRequest) returns (stream Notification);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (UnreadCountResponse);
  rpc MarkNotificationsRead(MarkReadRequest) returns (MarkReadResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
// Auth Messages
// ─────────────────────────────────────────────────────────────────────────────

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  string user_id = 2;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
}

message GetProfileRequest {
  string user_id = 1;
}

message UpdateProfileRequest {
  string display_name = 1;
  string avatar_url = 2;
}

message UserProfile {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  bool online = 5;
  google.protobuf.Timestamp created_at = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// Room Messages
// ─────────────────────────────────────────────────────────────────────────────

message CreateRoomRequest {
  string name = 1;
  bool is_direct = 2;
}

message GetRoomRequest {
  string room_id = 1;
}

message Room {
  string id = 1;
  string name = 2;
  string created_by = 3;
  bool is_direct = 4;
  int32 member_count = 5;
  google.protobuf.Timestamp created_at = 6;
}

message JoinRoomRequest {
  string room_id = 1;
}

message JoinRoomResponse {
  bool success = 1;
}

message LeaveRoomRequest {
  string room_id = 1;
}

message LeaveRoomResponse {
  bool success = 1;
}

message ListRoomsRequest {}

message ListRoomsResponse {
  repeated Room rooms = 1;
}

message ListRoomMembersRequest {
  string room_id = 1;
}

message ListRoomMembersResponse {
  repeated UserProfile members = 1;
}

message CreateDirectMessageRequest {
  string target_user_id = 1;
}

message GetRoomHistoryRequest {
  string room_id = 1;
  string cursor = 2;
  int32 limit = 3;
}

message GetRoomHistoryResponse {
  repeated ChatMessage messages = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Chat Messages
// ─────────────────────────────────────────────────────────────────────────────

enum MessageType {
  TEXT = 0;
  SYSTEM = 1;
  FILE_SHARE = 2;
}

message ChatMessage {
  string message_id = 1;
  string client_message_id = 2;
  string room_id = 3;
  string sender_id = 4;
  string content = 5;
  google.protobuf.Timestamp timestamp = 6;
  MessageType type = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// File Messages
// ─────────────────────────────────────────────────────────────────────────────

message FileChunk {
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message FileMetadata {
  string filename = 1;
  string room_id = 2;
  int64 total_size = 3;
}

message UploadFileResponse {
  string file_id = 1;
  string filename = 2;
  int64 size = 3;
  bool success = 4;
}

message GetFileURLRequest {
  string file_id = 1;
}

message GetFileURLResponse {
  string url = 1;
}

message DeleteFileRequest {
  string file_id = 1;
}

message DeleteFileResponse {
  bool success = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Notification Messages
// ─────────────────────────────────────────────────────────────────────────────

message SubscribeRequest {}

message Notification {
  string notification_id = 1;
  string user_id = 2;
  string room_id = 3;
  string message_id = 4;
  string sender_username = 5;
  string content_preview = 6;
  google.protobuf.Timestamp created_at = 7;
  bool is_read = 8;
}

message GetUnreadCountRequest {}

message UnreadCountResponse {
  int32 total = 1;
  map<string, int32> by_room = 2;
}

message MarkReadRequest {
  repeated string notification_ids = 1;
}

message MarkReadResponse {
  bool success = 1;
}
